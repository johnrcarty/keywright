[project]
name = "keywright-server"
version = "0.0.2"
description = "Keywright server: just-in-time credential broker for AI agents. One MCP front door, per-request human approval, no keys in agent context."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  # Keep production on the tested series; 2.1 exhibited ORM state corruption
  # during repeated grant loads on Python 3.13.
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.20",
  "asyncssh>=2.15",
  "httpx>=0.27",
  "authlib>=1.9.1,<2",
  "cryptography>=44",
  "httpx2>=2.13,<3",
  "websockets>=12",
  "mcp>=2.2,<3",
  "pydantic>=2.7",
  "keywright>=0.0.2,<0.1",
]

[project.optional-dependencies]
knowledge = ["asyncpg>=0.30,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/johnrcarty/keywright"
Issues = "https://github.com/johnrcarty/keywright/issues"

[project.scripts]
keywright-server = "keywright_server.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keywright_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "client/tests", "router/tests"]
pythonpath = [".", "client", "router"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES", "/keywright_server", "/pyproject.toml", "/README.md"]
