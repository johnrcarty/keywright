[project]
name = "keywright"
version = "0.0.1"
description = "Keywright client: the kw command agents use to reach brokered hosts and tools, the hazard tripwire, and the agent-machine setup."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/johnrcarty/keywright"
Issues = "https://github.com/johnrcarty/keywright/issues"

[project.scripts]
keywright = "keywright.cli:main"
kw = "keywright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keywright"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.sdist]
include = ["/keywright", "/pyproject.toml", "/README.md"]
