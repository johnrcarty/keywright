{% macro icon(name) -%}

{% elif name == 'requests' %}<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/>
{% elif name == 'activity' %}<path d="M3 12h4l3-7 4 14 3-7h4"/>
{% elif name == 'ssh' %}<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/>
{% elif name == 'mcp' %}<rect x="8" y="8" width="8" height="8" rx="2"/><path d="M12 3v5m0 8v5M3 12h5m8 0h5M5 5l3 3m8 8 3 3M5 19l3-3m8-8 3-3"/>

{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'more' %}<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>

{% else %}<path d="m5 6 7 6-7 6V6Zm10 12h5"/>{% endif %}
</svg>
