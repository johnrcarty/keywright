<script>
(function () {
  function tick() {
    document.querySelectorAll('[data-until]').forEach(function (el) {
      var seconds = Math.max(0, Math.ceil((Date.parse(el.dataset.until) - Date.now()) / 1000));
      if (!Number.isFinite(seconds)) return;
      el.textContent = seconds ? 'expires in ' + Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's' : 'expired';
    });
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
