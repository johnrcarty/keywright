# Optional overlay: docker compose -f compose.yaml -f llm.compose.yml -f knowledge.compose.yml up -d
# Set KNOWLEDGE_PG_PASSWORD in .env and configure knowledge.env from knowledge.env.example.
services:
  keywright:
    env_file: [knowledge.env]
    depends_on:
      knowledge-postgres: { condition: service_healthy }
  knowledge-postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${KNOWLEDGE_PG_PASSWORD:?set KNOWLEDGE_PG_PASSWORD}
    volumes:
      - knowledge-pg:/var/lib/postgresql/data
      - ./knowledge-schema.sql:/docker-entrypoint-initdb.d/knowledge.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knowledge -d knowledge]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  knowledge-pg: {}
