# Prebuilt broker. This file is sufficient for a core installation.
name: keywright
services:
  keywright:
    image: ${KEYWRIGHT_IMAGE:-ghcr.io/johnrcarty/keywright:0.0.2-preview}
    ports:
      - "${KW_BIND_ADDRESS:-127.0.0.1}:${KW_HTTP_PORT:-8700}:8700"
    environment:
      KW_PUBLIC_URL: ${KW_PUBLIC_URL:-http://localhost:8700}
      KW_TRUSTED_PROXIES: ${KW_TRUSTED_PROXIES:-}
    volumes:
      - keywright-data:/data
    restart: unless-stopped
volumes:
  keywright-data: {}
