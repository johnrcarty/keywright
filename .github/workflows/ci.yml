name: test build and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: keywright-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      knowledge-postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: knowledge
          POSTGRES_DB: knowledge
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source packages
        run: python -m pip install ./client ".[dev,knowledge]" ./router build
      - name: Run server, client and router tests
        env:
          KNOWLEDGE_TEST_PG_URL: postgresql://knowledge:isolated-ci-only@127.0.0.1:${{ job.services.knowledge-postgres.ports['5432'] }}/knowledge
        run: python -m pytest -q
      - name: Verify topology layout
        run: node --test tests/test_topology_layout.cjs
      - name: Build distributions
        run: |
          python -m build client --outdir dist
          python -m build . --outdir dist
          python -m build router --outdir dist
      - name: Smoke-test installed wheels outside the checkout
        run: |
          python -m venv /tmp/kw-wheel-test
          /tmp/kw-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/kw-wheel-test/bin/kw version
          /tmp/kw-wheel-test/bin/keywright-server --help
          /tmp/kw-wheel-test/bin/keywright-router --help
          status=0
          /tmp/kw-wheel-test/bin/kw hazards "git push --force" || status=$?
          test "$status" -eq 2
          /tmp/kw-wheel-test/bin/python -c "import sys, keywright.cli; assert 'mcp' not in sys.modules"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/

  image-meta:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Validate image version and select channel
        run: |
          python3 - <<'PYMETA'
          import os, re, tomllib
          from pathlib import Path
          versions = [tomllib.loads(Path(p).read_text())["project"]["version"]
                      for p in ("pyproject.toml", "client/pyproject.toml", "router/pyproject.toml")]
          version = versions[0]
          assert len(set(versions)) == 1, "Server, client and router versions must match"
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Use a numeric release version"
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              assert ref == f"refs/tags/v{version}", "Tag must match package versions"
              tag = version
          else:
              tag = version + "-preview"
          values = {"image": "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower(),
                    "version": version, "tag": tag, "sha_tag": "sha-" + os.environ["GITHUB_SHA"]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in values.items():
                  print(f"{key}={value}", file=out)
          PYMETA

  container:
    needs: image-meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.image-meta.outputs.image }}
      CANDIDATE: ${{ needs.image-meta.outputs.image }}:${{ needs.image-meta.outputs.sha_tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.CANDIDATE }}
          labels: |
            org.opencontainers.image.version=${{ needs.image-meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=broker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=broker-${{ matrix.arch }}
      - name: Test image through standalone Compose
        run: bash scripts/smoke-image.sh "$CANDIDATE" "${{ needs.image-meta.outputs.version }}" never
      - name: Export verified license inventory
        run: |
          docker run --rm --network none --entrypoint python "$CANDIDATE" \
            /usr/share/keywright/release_materials.py inventory > inventory.json
      - uses: actions/cache@v4
        with:
          path: /tmp/keywright-source-cache
          key: third-party-sources-${{ hashFiles('third_party/sources.lock.json') }}
      - name: Prepare exact source and notice materials
        run: |
          python3 scripts/release_materials.py collect --license-root third_party \
            --inventory inventory.json --output materials \
            --cache /tmp/keywright-source-cache --repository .
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: third-party-source-${{ matrix.arch }}
          path: materials/sources.tar
          compression-level: 0
          retention-days: 7
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish corresponding source before the application image
        run: |
          source_tag="$IMAGE:sources-${GITHUB_SHA}-${{ matrix.arch }}"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$source_tag" materials
          docker push "$source_tag"
          source_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$source_tag")
          [[ "$source_ref" =~ ^ghcr.io/.+@sha256:[0-9a-f]{64}$ ]]
          printf 'ARG BASE\nFROM ${BASE}\nARG SOURCE\nLABEL io.keywright.source-image="${SOURCE}"\n' > source-link.Dockerfile
          docker build -f source-link.Dockerfile --build-arg "BASE=$CANDIDATE" \
            --build-arg "SOURCE=$source_ref" -t "$CANDIDATE" .
          test "$(docker image inspect --format '{{index .Config.Labels "io.keywright.source-image"}}' "$CANDIDATE")" = "$source_ref"
          printf '%s\n' "$source_ref" > materials/source-image.txt
      - name: Publish tested architecture and record its digest
        run: |
          docker push "$CANDIDATE"
          mkdir -p digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$CANDIDATE" > "digests/${{ matrix.arch }}.txt"
          grep -Eq '^ghcr.io/.+@sha256:[0-9a-f]{64}$' "digests/${{ matrix.arch }}.txt"
      - name: Bind material checksums to the published application image
        run: |
          cp "digests/${{ matrix.arch }}.txt" materials/application-image.txt
          (cd materials && sha256sum source-image.txt application-image.txt >> SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-${{ matrix.arch }}
          path: |
            materials/*.json
            materials/*.txt
            materials/SHA256SUMS
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*.txt

  publish-image:
    needs: [image-meta, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ${{ needs.image-meta.outputs.image }}
      TAG: ${{ needs.image-meta.outputs.tag }}
      SHA_TAG: ${{ needs.image-meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: publish
        name: Publish manifest and pin the installation file
        run: |
          test -s digests/amd64.txt && test -s digests/arm64.txt
          mapfile -t images < <(cat digests/amd64.txt digests/arm64.txt)
          docker buildx imagetools create --tag "$IMAGE:$SHA_TAG" --tag "$IMAGE:$TAG" "${images[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$SHA_TAG" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          python3 scripts/build-install-bundle.py "$IMAGE@$digest" install
          printf '### Prebuilt broker\n\n`%s:%s`\n\n`%s@%s`\n' "$IMAGE" "$TAG" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: keywright-install
          path: install/
          include-hidden-files: true # Only allowlisted files, including .env.example, enter install/.
          retention-days: 90

  verify-published-image:
    needs: [image-meta, publish-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: keywright-install
          path: install
      - name: Pull the published manifest and verify the install bundle
        run: |
          (cd install && sha256sum -c SHA256SUMS)
          python3 - <<'PYCONFIG'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary) / "install"
              shutil.copytree("install", root)
              for name in (".env", "knowledge.env", "litellm.env"):
                  shutil.copyfile(root / (name + ".example"), root / name)
              env = dict(os.environ, KNOWLEDGE_PG_PASSWORD="isolated-test-only",
                         PG_PASSWORD="isolated-test-only", LITELLM_MASTER_KEY="isolated-test-only",
                         LITELLM_SALT_KEY="isolated-test-only")
              for overlays in (("knowledge.compose.yml",), ("llm.compose.yml", "knowledge.compose.yml")):
                  command = ["docker", "compose", "-f", "compose.yaml"]
                  for overlay in overlays:
                      command.extend(["-f", overlay])
                  result = subprocess.run(command + ["config", "--format", "json"],
                                          cwd=root, env=env, capture_output=True, text=True, check=True)
                  services = json.loads(result.stdout)["services"]
                  assert services["keywright"]["image"] == (root / "image.txt").read_text().strip()
                  for name, service in services.items():
                      assert "build" not in service
                      if name != "keywright":
                          assert not service.get("ports")
                      for volume in service.get("volumes", []):
                          if volume["type"] == "bind":
                              assert Path(volume["source"]).is_file()
          print("Downloaded knowledge and LLM configurations verified without a source checkout")
          PYCONFIG
          bash scripts/smoke-image.sh "${{ needs.image-meta.outputs.image }}@${{ needs.publish-image.outputs.digest }}" "${{ needs.image-meta.outputs.version }}" always install/compose.yaml
          image="${{ needs.image-meta.outputs.image }}@${{ needs.publish-image.outputs.digest }}"
          source_ref=$(docker image inspect --format '{{index .Config.Labels "io.keywright.source-image"}}' "$image")
          [[ "$source_ref" =~ ^ghcr.io/.+@sha256:[0-9a-f]{64}$ ]]
          docker run --rm --network none --entrypoint python "$image" \
            /usr/share/keywright/release_materials.py inventory > published-inventory.json
          docker pull "$source_ref"
          source_container=$(docker create "$source_ref" /unused)
          trap 'docker rm -f "$source_container" >/dev/null' EXIT
          docker cp "$source_container:/" fetched-sources
          python3 scripts/check-published-sources.py published-inventory.json fetched-sources


  release-draft:
    needs: [publish-image, verify-published-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: third-party-*
          path: release-input
      - uses: actions/download-artifact@v4
        with:
          name: keywright-install
          path: release-input/install
      - name: Assemble reviewed release assets
        run: python3 scripts/prepare-release-assets.py release-input release-assets
      - name: Attach assets to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to modify a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Keywright $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.txt
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
